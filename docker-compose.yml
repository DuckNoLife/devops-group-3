version: '3.8'

services:
  # 1. Frontend service
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # Truyền URL của backend vào React app để fetch đúng địa chỉ khi chạy Docker
      - REACT_APP_API_URL=http://localhost:8080
    depends_on:
      - backend

  # 2. Backend service
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      # Các biến môi trường kết nối Database
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=devops_db
      - DB_USER=postgres
      - DB_PASSWORD=secret_password
    depends_on:
      postgres:
        # Bắt buộc đợi Postgres vượt qua bài test healthcheck mới khởi động Backend
        condition: service_healthy
    healthcheck:
      # Kiểm tra xem backend đã sẵn sàng nhận request chưa
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Postgres service
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      # Khởi tạo thông tin mặc định cho Database
      - POSTGRES_DB=devops_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret_password
    volumes:
      # Lưu trữ dữ liệu cố định (để không mất data khi tắt container)
      - postgres_data:/var/lib/postgresql/data
      # Mount script để tự động chạy khi khởi tạo database lần đầu
      - ./database/database.sql:/docker-entrypoint-initdb.d/database.sql
    healthcheck:
      # Dùng pg_isready theo đúng gợi ý của đề bài
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

# 4. Define named volumes
volumes:
  postgres_data:
  - postgres_data:/var/lib/postgresql/data